name: logistics-platform

x-core-platform-development: &core-platform-development
  build:
    context: ../..
    dockerfile: apps/core-platform/Dockerfile
    target: development
  env_file:
    - ../../apps/core-platform/.env
  depends_on:
    core-platform-migrations:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  init: true
  stop_grace_period: 10s
  develop:
    watch:
      - action: sync+restart
        path: ../../apps/core-platform
        target: /workspace/apps/core-platform
        ignore:
          - .env
          - Dockerfile
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: sync+restart
        path: ../../packages/background-processing/typescript
        target: /workspace/packages/background-processing/typescript
        ignore:
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: sync+restart
        path: ../../packages/grpc-contracts
        target: /workspace/packages/grpc-contracts
        ignore:
          - package.json
          - node_modules/
          - dist/
      - action: sync+restart
        path: ../../packages/integration-event-contracts/typescript
        target: /workspace/packages/integration-event-contracts/typescript
        ignore:
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: sync+restart
        path: ../../packages/integration-events/typescript
        target: /workspace/packages/integration-events/typescript
        ignore:
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: sync+restart
        path: ../../packages/querying/typescript
        target: /workspace/packages/querying/typescript
        ignore:
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: sync+restart
        path: ../../packages/validation/typescript
        target: /workspace/packages/validation/typescript
        ignore:
          - package.json
          - node_modules/
          - dist/
          - "*.tsbuildinfo"
      - action: rebuild
        path: ../../apps/core-platform/package.json
      - action: rebuild
        path: ../../apps/core-platform/Dockerfile
      - action: rebuild
        path: ../../packages/background-processing/typescript/package.json
      - action: rebuild
        path: ../../packages/grpc-contracts/package.json
      - action: rebuild
        path: ../../packages/integration-event-contracts/typescript/package.json
      - action: rebuild
        path: ../../packages/integration-events/typescript/package.json
      - action: rebuild
        path: ../../packages/querying/typescript/package.json
      - action: rebuild
        path: ../../packages/validation/typescript/package.json
      - action: rebuild
        path: ../../package.json
      - action: rebuild
        path: ../../pnpm-lock.yaml
      - action: rebuild
        path: ../../pnpm-workspace.yaml
      - action: rebuild
        path: ../../.dockerignore

services:
  core-platform-migrations:
    build:
      context: ../..
      dockerfile: apps/core-platform/Dockerfile
      target: development
    command:
      - pnpm
      - --filter
      - "@logistics-decision-intelligence/core-platform"
      - db:migrate:dev
    env_file:
      - ../../apps/core-platform/.env
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"

  core-platform-api:
    <<: *core-platform-development
    environment:
      PROCESS_ROLE: api
    ports:
      - "127.0.0.1:${PORT}:3000"
      - "127.0.0.1:${GRPC_PORT:-50051}:50051"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT??'3000')+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Add future background responsibilities, such as cron jobs, to this worker deployment.
  core-platform-background-processing:
    <<: *core-platform-development
    environment:
      PROCESS_ROLE: worker
    depends_on:
      - vroom
      - osrm

  postgres:
    image: postgres:18
    env_file:
      - ../../apps/core-platform/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/france-latest.osrm
    volumes:
      - osrm-data:/data
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom-conf:/conf
    depends_on:
      - osrm
    ports:
      - "127.0.0.1:${VROOM_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  osrm-data:
