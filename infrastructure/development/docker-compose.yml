name: logistics-platform

services:
  core-platform-migrations:
    build:
      context: ../..
      dockerfile: apps/core-platform/Dockerfile
      target: development
    command:
      - pnpm
      - --filter
      - "@logistics-decision-intelligence/core-platform"
      - db:migrate:dev
    env_file:
      - ../../apps/core-platform/.env
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"

  core-platform:
    build:
      context: ../..
      dockerfile: apps/core-platform/Dockerfile
      target: development
    env_file:
      - ../../apps/core-platform/.env
    ports:
      - "127.0.0.1:${PORT}:3000"
    depends_on:
      core-platform-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT??'3000')+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/core-platform
          target: /workspace/apps/core-platform
          ignore:
            - .env
            - Dockerfile
            - package.json
            - node_modules/
            - dist/
            - "*.tsbuildinfo"
        - action: sync+restart
          path: ../../packages/contracts
          target: /workspace/packages/contracts
          ignore:
            - package.json
            - node_modules/
            - dist/
        - action: rebuild
          path: ../../apps/core-platform/package.json
        - action: rebuild
          path: ../../apps/core-platform/Dockerfile
        - action: rebuild
          path: ../../packages/contracts/package.json
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml
        - action: rebuild
          path: ../../.dockerignore

  postgres:
    image: postgres:18
    env_file:
      - ../../apps/core-platform/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
