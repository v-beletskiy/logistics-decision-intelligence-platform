syntax = "proto3";

package operational_workspace.v1;

import "google/protobuf/timestamp.proto";
import "shared/v1/geography.proto";

message RouteAnalysisContext {
  string route_id = 1;
  uint64 route_version = 2;
  repeated RouteStop stops = 3;
}

message RouteStop {
  string shipment_id = 1;
  shared.v1.GeoPoint location = 2;
  google.protobuf.Timestamp planned_arrival_at = 3;
  google.protobuf.Timestamp planned_departure_at = 4;
  string route_stop_id = 5;
  RouteStopOperationType operation_type = 6;
  google.protobuf.Timestamp requested_time_window_start_at = 7;
  google.protobuf.Timestamp requested_time_window_end_at = 8;
}

enum RouteStopOperationType {
  ROUTE_STOP_OPERATION_TYPE_UNSPECIFIED = 0;
  ROUTE_STOP_OPERATION_TYPE_PICKUP = 1;
  ROUTE_STOP_OPERATION_TYPE_DELIVERY = 2;
}
